name: Validate approved set artwork derivatives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-derivatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate derivatives without modifying approved originals
        run: node scripts/upscale-approved-set-artwork.mjs
      - name: Verify committed originals and derivatives
        run: |
          npx vitest run tests/set-icon-artwork-resolution.test.ts
          git diff --exit-code -- public/icons/sets/ public/icons/sets-preview/ public/icons/sets-card/
