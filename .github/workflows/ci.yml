name: Validate UglyDex
on: [push, pull_request]
# Keep dormant gallery behavior covered by the existing integration suite.
env:
  NEXT_PUBLIC_GALLERIES_ENABLED: 'true'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:db -- --web --browser --catalog
      - name: Preserve sanitized replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-evidence
          include-hidden-files: true
          path: |
            .data/phase9-replay*.json
            .data/collector-card-*.png
            .data/mobile-card-*.png
            .data/design/*.png
            .data/uglydex-*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run format:check

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:identity

  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: node --import tsx --conditions=react-server scripts/test-interactive-cards.ts
      - name: Preserve real card exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-card-evidence
          include-hidden-files: true
          path: .data/interactive-cards/*
          retention-days: 14
